[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrodynamics_surrogate"
version = "1.0.0"
description = "Symplectic Hamiltonian Neural Network (HNN) & PINN Surrogate for AstroDynamics 3D"
authors = [{ name = "Moisés Alejandro Amundarain Romero" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
